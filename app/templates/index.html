{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="mb-0">
                        <i class="fas fa-bus me-2"></i>バス時刻表
                    </h2>
                </div>
                <div class="card-body">
                    <p class="lead">ようこそ！このアプリケーションでは、バスの時刻表を確認できます。</p>
                    {% if current_user.is_authenticated %}
                        {% if current_user.is_admin %}
                            <a href="{{ url_for('admin.timetable') }}" class="btn btn-primary">
                                <i class="fas fa-clock me-1"></i>時刻表管理
                            </a>
                        {% endif %}
                    {% else %}
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt me-1"></i>ログイン
                            </a>
                            <a href="{{ url_for('auth.register') }}" class="btn btn-secondary">
                                <i class="fas fa-user-plus me-1"></i>新規登録
                            </a>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
