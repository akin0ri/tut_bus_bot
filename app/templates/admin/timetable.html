{% extends 'base.html' %}
{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2 class="mb-4">
            <i class="fas fa-clock me-2"></i>時刻表一覧
        </h2>
    </div>
    <div class="col-auto">
        <div class="btn-group">
            <a href="{{ url_for('admin.add_timetable') }}" class="btn btn-primary">
                <i class="fas fa-plus me-1"></i>新規追加
            </a>
            <a href="{{ url_for('admin.download') }}" class="btn btn-success">
                <i class="fas fa-download me-1"></i>CSVダウンロード
            </a>
            <a href="{{ url_for('admin.download_template') }}" class="btn btn-info">
                <i class="fas fa-file-download me-1"></i>テンプレート
            </a>
            <a href="{{ url_for('admin.upload') }}" class="btn btn-warning">
                <i class="fas fa-upload me-1"></i>CSVアップロード
            </a>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>路線</th>
                        <th>方向</th>
                        <th>出発</th>
                        <th>到着</th>
                        <th>適用開始</th>
                        <th>適用終了</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for t in timetables %}
                    <tr>
                        <td>{{ t.id }}</td>
                        <td>{{ t.route }}</td>
                        <td>{{ t.direction }}</td>
                        <td>{{ t.departure_time }}</td>
                        <td>{{ t.arrival_time }}</td>
                        <td>{{ t.valid_from }}</td>
                        <td>{{ t.valid_to }}</td>
                        <td>
                            <div class="btn-group">
                                <a href="{{ url_for('admin.edit_timetable', timetable_id=t.id) }}" 
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <form method="post" action="{{ url_for('admin.delete_timetable', timetable_id=t.id) }}" 
                                      style="display:inline;" onsubmit="return confirm('本当に削除しますか？');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
