{% extends 'base.html' %}
{% block content %}
<h2>時刻表一覧</h2>
<a href="{{ url_for('admin.add_timetable') }}">新規追加</a> |
<a href="{{ url_for('admin.download') }}">CSVダウンロード</a> |
<a href="{{ url_for('admin.download_template') }}">CSVテンプレート</a> |
<a href="{{ url_for('admin.upload') }}">CSVアップロード</a>
<table border="1">
    <tr>
        <th>ID</th><th>路線</th><th>方向</th><th>出発</th><th>到着</th><th>適用開始</th><th>適用終了</th><th>操作</th>
    </tr>
    {% for t in timetables %}
    <tr>
        <td>{{ t.id }}</td>
        <td>{{ t.route }}</td>
        <td>{{ t.direction }}</td>
        <td>{{ t.departure_time }}</td>
        <td>{{ t.arrival_time }}</td>
        <td>{{ t.valid_from }}</td>
        <td>{{ t.valid_to }}</td>
        <td>
            <a href="{{ url_for('admin.edit_timetable', timetable_id=t.id) }}">編集</a>
            <form method="post" action="{{ url_for('admin.delete_timetable', timetable_id=t.id) }}" style="display:inline;">
                <button type="submit" onclick="return confirm('本当に削除しますか？')">削除</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
