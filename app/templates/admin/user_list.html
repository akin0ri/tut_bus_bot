{% extends 'base.html' %}
{% block content %}
<h2>ユーザー管理</h2>
<table border="1">
    <tr>
        <th>ID</th><th>ユーザー名</th><th>有効</th><th>作成日</th><th>更新日</th>
    </tr>
    {% for u in users %}
    <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{{ '有効' if u.is_active else '無効' }}</td>
        <td>{{ u.created_at }}</td>
        <td>{{ u.updated_at }}</td>
    </tr>
    {% endfor %}
</table>
<a href="{{ url_for('admin.timetable') }}">戻る</a>
{% endblock %}
