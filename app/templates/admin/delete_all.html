{% extends 'base.html' %}
{% block content %}

<p>本当に全てのデータを削除しますか？この操作は元に戻せません。</p>
<form method="post" action="{{ url_for('admin.delete_all') }}">

    <a href="{{ url_for('admin.timetable') }}">キャンセル</a>
</form>
{% endblock %}
