{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h2 class="mb-0">
                    <i class="fas fa-edit me-2"></i>時刻表編集
                </h2>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">路線</label>
                        <input type="text" name="route" class="form-control" value="{{ timetable.route }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">方向</label>
                        <input type="number" name="direction" class="form-control" value="{{ timetable.direction }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">出発時刻</label>
                        <input type="time" name="departure_time" class="form-control" value="{{ timetable.departure_time }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">到着時刻</label>
                        <input type="time" name="arrival_time" class="form-control" value="{{ timetable.arrival_time }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">適用開始日</label>
                        <input type="date" name="valid_from" class="form-control" value="{{ timetable.valid_from }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">適用終了日</label>
                        <input type="date" name="valid_to" class="form-control" value="{{ timetable.valid_to }}">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.timetable') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i>戻る
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>更新
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
