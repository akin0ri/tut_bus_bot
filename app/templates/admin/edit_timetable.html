{% extends 'base.html' %}
{% block content %}
<h2>時刻表編集</h2>
<form method="post">
    <label>路線: <input type="text" name="route" value="{{ timetable.route }}" required></label><br>
    <label>方向: <input type="number" name="direction" value="{{ timetable.direction }}" required></label><br>
    <label>出発時刻: <input type="time" name="departure_time" value="{{ timetable.departure_time }}" required></label><br>
    <label>到着時刻: <input type="time" name="arrival_time" value="{{ timetable.arrival_time }}"></label><br>
    <label>適用開始日: <input type="date" name="valid_from" value="{{ timetable.valid_from }}" required></label><br>
    <label>適用終了日: <input type="date" name="valid_to" value="{{ timetable.valid_to }}"></label><br>
    <button type="submit">更新</button>
</form>
<a href="{{ url_for('admin.timetable') }}">戻る</a>
{% endblock %}
