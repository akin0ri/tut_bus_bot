version: '3'

services:
  # sync devcontainer.json 'service'
  python3:
    # original container naame
    container_name: tut_bus_bot
    build:
      context: .
      dockerfile: Dockerfile
    tty: true
    # working dir
    working_dir: /workspace
    # setting volume (host:container)
    volumes:
      - ..:/workspace
    # Add port mapping
    ports:
      - "5050:5050"
    # Add network settings
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
