version: '3.8'

services:
  app:
    build: .
    container_name: tut_bus_bot_app
    env_file:
      - ./.env
    environment:
      FLASK_ENV: "${FLASK_ENV}"
      DATABASE_URL: "${DATABASE_URL}"
      SECRET_KEY: "${SECRET_KEY}"
    ports:
      - "5000:5000"
    volumes:
      - .:/workspace
    depends_on:
      - db
  db:
    image: postgres:15
    container_name: tut_bus_bot_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tutbusbot
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  ngrok:
    image: ngrok/ngrok:latest
    container_name: tut_bus_bot_ngrok
    command: http app:5000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - app
volumes:
  db_data:
